name: Dependency Scan

on:
  push:
    branches:
      - 'rel/**'

concurrency:             # prevents duplicate runs if you push twice quickly
  group: dependency-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle             # build cache, saves some time
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run Dependency Doctor
        run: ./gradlew dependencyDoctor
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SOURCE_BRANCH: ${{ github.ref_name }}

      # The artifact name can't contain /, but rel/1.0.0 has one. Fix is simple
      - name: Sanitize artifact name
        id: artifact
        run: |
          SAFE_NAME=$(echo "${{ github.ref_name }}" | tr '/' '-')
          echo "name=dependency-updates-${SAFE_NAME}" >> $GITHUB_OUTPUT

      # upload the JSON the plugin wrote — keyed by branch name so the
      # update workflow can find exactly the right scan for this branch
      - name: Upload dependency updates JSON
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: build/dependency-doctor/updates.json
          retention-days: 7

