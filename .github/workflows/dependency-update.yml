name: Dependency Update

on:
  workflow_dispatch:
    inputs:
      update_type:
        description: 'patch / minor / major'
        required: true
      dependency_name:
        description: 'specific dependency name (empty = all)'
        required: false
        default: ''
      slack_channel:
        description: 'Slack channel to notify'
        required: false
      slack_thread_ts:
        description: 'Slack thread timestamp'
        required: false

jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install tomlkit

      - name: Create update branch
        id: branch
        run: |
          BRANCH="deps/${{ inputs.update_type }}-update-$(date +%Y-%m-%d-%H%M)"
          git checkout -b $BRANCH
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      - name: Run dependency update script
        run: python scripts/update_deps.py "${{ inputs.update_type }}" "${{ inputs.dependency_name }}"
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

      - name: Check if anything changed
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "renovate-bot"
          git config user.email "renovate-bot@poshmark.com"
          git add gradle/libs.versions.toml
          git commit -m "chore: update ${{ inputs.update_type }} dependencies"
          git push origin ${{ steps.branch.outputs.branch }}

      - name: Create Pull Request
        if: steps.changes.outputs.changed == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CHANGED=$(cat changed_deps.txt)
          PR_URL=$(gh pr create \
            --base ${{ github.ref_name }} \
            --head ${{ steps.branch.outputs.branch }} \
            --title "chore: update ${{ inputs.update_type }} dependencies" \
            --body "## Dependency Updates (${{ inputs.update_type }})
            Auto-generated by RenovateBot via Slack.
          
            ### Changes:
            $CHANGED
          
            Triggered by: @${{ github.actor }}")
          echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT

      - name: Notify Slack
        if: steps.changes.outputs.changed == 'true'
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
            -H 'Content-Type: application/json' \
            -d "{
              \"text\": \"✅ PR raised for *${{ inputs.update_type }}* updates!\n${{ steps.pr.outputs.pr_url }}\",
              \"thread_ts\": \"${{ inputs.slack_thread_ts }}\"
            }"

      - name: Notify Slack — no changes
        if: steps.changes.outputs.changed == 'false'
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
            -H 'Content-Type: application/json' \
            -d "{
              \"text\": \"ℹ️ No ${{ inputs.update_type }} updates found to apply.\",
              \"thread_ts\": \"${{ inputs.slack_thread_ts }}\"
            }"