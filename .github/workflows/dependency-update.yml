name: Dependency Update

on:
  workflow_dispatch:
    inputs:
      update_type:
        description: 'patch / minor / major'
        required: true
      dependency_name:
        description: 'specific dependency name (empty = all)'
        required: false
        default: ''
      slack_channel:
        description: 'Slack channel to notify'
        required: false
      slack_thread_ts:
        description: 'Slack thread timestamp'
        required: false

concurrency:
  group: dependency-update-${{ github.ref }}
  cancel-in-progress: false   # don't cancel in-progress updates — let them finish

jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install tomlkit

      # download the JSON that the scan workflow already produced
      # artifact name must match what dependency-scan.yml uploaded
      - name: Sanitize artifact name
        id: artifact
        run: |
          SAFE_NAME=$(echo "${{ github.ref_name }}" | tr '/' '-')
          echo "name=dependency-updates-${SAFE_NAME}" >> $GITHUB_OUTPUT

      - name: Download dependency updates JSON
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: dependency-updates
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for existing PR
        id: check_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh pr list \
            --base ${{ github.ref_name }} \
            --search "chore: update ${{ inputs.update_type }} dependencies" \
            --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "pr_number=$EXISTING" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Skip if PR already exists
        if: steps.check_pr.outputs.exists == 'true'
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
            -H 'Content-Type: application/json' \
            -d "{
              \"text\": \"ℹ️ PR already exists for *${{ inputs.update_type }}* updates on \`${{ github.ref_name }}\` → PR #${{ steps.check_pr.outputs.pr_number }}\",
              \"thread_ts\": \"${{ inputs.slack_thread_ts }}\"
            }"
          exit 0

      - name: Create update branch
        if: steps.check_pr.outputs.exists != 'true'
        id: branch
        run: |
          BRANCH="deps/${{ inputs.update_type }}-update-$(date +%Y-%m-%d-%H%M)"
          git checkout -b $BRANCH
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      - name: Run dependency update script
        if: steps.check_pr.outputs.exists != 'true'
        run: |
          python scripts/update_deps.py \
            "${{ inputs.update_type }}" \
            "${{ inputs.dependency_name }}" \
            "dependency-updates/updates.json"

      - name: Check if anything changed
        if: steps.check_pr.outputs.exists != 'true'
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push
        if: steps.check_pr.outputs.exists != 'true' && steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "renovate-bot"
          git config user.email "renovate-bot@yourorg.com"
          git add gradle/libs.versions.toml
          git commit -m "chore: update ${{ inputs.update_type }} dependencies"
          git push origin ${{ steps.branch.outputs.branch }}

      - name: Create Pull Request
        if: steps.check_pr.outputs.exists != 'true' && steps.changes.outputs.changed == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CHANGED=$(cat changed_deps.txt)
          PR_URL=$(gh pr create \
            --base ${{ github.ref_name }} \
            --head ${{ steps.branch.outputs.branch }} \
            --title "chore: update ${{ inputs.update_type }} dependencies" \
            --body "## Dependency Updates (${{ inputs.update_type }})
            Auto-generated by RenovateBot via Slack.
          
            ### Changes:
            $CHANGED
          
            Triggered by: @${{ github.actor }}")
          echo "pr_url=$PR_URL" >> $GITHUB_OUTPUT

      - name: Notify Slack — PR raised
        if: steps.check_pr.outputs.exists != 'true' && steps.changes.outputs.changed == 'true'
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
            -H 'Content-Type: application/json' \
            -d "{
              \"text\": \"✅ PR raised for *${{ inputs.update_type }}* updates on \`${{ github.ref_name }}\`!\n${{ steps.pr.outputs.pr_url }}\",
              \"thread_ts\": \"${{ inputs.slack_thread_ts }}\"
            }"

      - name: Notify Slack — no changes
        if: steps.check_pr.outputs.exists != 'true' && steps.changes.outputs.changed == 'false'
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} \
            -H 'Content-Type: application/json' \
            -d "{
              \"text\": \"ℹ️ No ${{ inputs.update_type }} updates found on \`${{ github.ref_name }}\`.\",
              \"thread_ts\": \"${{ inputs.slack_thread_ts }}\"
            }"
