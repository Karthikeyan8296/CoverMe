name: Weekly Dependency Scan

on:
  push:
    branches:
      - 'master'

jobs:
  scan-and-notify:
    runs-on: ubuntu-latest

    steps:

      # ── 1. Checkout your rel branch ─────────────────────────────────────────
      - name: Checkout rel branch
        uses: actions/checkout@v4

      # ── 2. Run Renovate in dry-run mode ─────────────────────────────────────
      #    FIX: --repositories is NOT a valid CLI flag.
      #    Pass it as RENOVATE_REPOSITORIES env var (JSON array string).
      - name: Run Renovate dry-run scan
        run: |
          npx --yes renovate \
            --dry-run=full \
            --log-level=debug \
            --log-format=json \
            2>&1 | tee /tmp/renovate.log || true
        env:
          RENOVATE_TOKEN:        ${{ secrets.RENOVATE_TOKEN }}
          RENOVATE_PLATFORM:     github
          RENOVATE_REPOSITORIES: '["${{ github.repository }}"]'
          RENOVATE_AUTODISCOVER: 'false'

      # ── DEBUG: show what Renovate actually logged (remove after confirming) ──
      - name: Debug — show renovate log tail
        run: |
          echo "=== Last 30 lines of renovate log ==="
          tail -30 /tmp/renovate.log
          echo "=== Lines containing updateType ==="
          grep -c '"updateType"' /tmp/renovate.log || echo "0 updateType lines found"

      # ── 3. Parse the log and build the Slack message ─────────────────────────
      #    Pure Node.js — no npm install needed, just built-in fs module.
      #    Reads each line of the ndjson log, finds dependency update entries,
      #    groups them into major / minor / patch, formats the Slack message.
      - name: Parse log and format Slack message
        id: build_message
        run: |
          node << 'EOF'
          const fs = require('fs');

          const raw = fs.readFileSync('/tmp/renovate.log', 'utf8');
          const lines = raw.split('\n').filter(Boolean);

          const updates = { major: [], minor: [], patch: [] };

          for (const line of lines) {
            let entry;
            try { entry = JSON.parse(line); } catch { continue; }

            // Renovate logs a "packageFiles with updates" entry — this has all deps
            if (entry.msg !== 'packageFiles with updates') continue;

            const packageFiles = entry.config?.packageFiles || {};

            for (const [manager, files] of Object.entries(packageFiles)) {
              for (const file of (Array.isArray(files) ? files : [])) {
                const moduleName = file.packageFile || manager;
                for (const dep of (file.deps || [])) {
                  for (const update of (dep.updates || [])) {
                    const type = update.updateType; // "major" | "minor" | "patch"
                    if (!updates[type]) continue;

                    updates[type].push({
                      module: moduleName,
                      name:   dep.depName || dep.packageName,
                      from:   dep.currentVersion || dep.currentValue,
                      to:     update.newVersion
                    });
                  }
                }
              }
            }
          }

          // ── Format the Slack Block Kit JSON ──────────────────────────────────
          const fmt = (list) =>
            list.length === 0
              ? [{ type: 'section', text: { type: 'mrkdwn', text: '_None_' } }]
              : list.map(u => ({
                  type: 'section',
                  text: {
                    type: 'mrkdwn',
                    text: `\`[${u.module}]\` *${u.name}*   \`${u.from}\` → \`${u.to}\``
                  }
                }));

          const total = updates.major.length + updates.minor.length + updates.patch.length;
          const today = new Date().toLocaleDateString('en-US', {
            weekday: 'long', month: 'short', day: 'numeric', year: 'numeric'
          });

          const payload = {
            blocks: [
              {
                type: 'header',
                text: { type: 'plain_text', text: '📦  Dependency Update Report' }
              },
              {
                type: 'context',
                elements: [{
                  type: 'mrkdwn',
                  text: `${today}  |  Branch: \`rel\`  |  *${total} updates available*`
                }]
              },
              { type: 'divider' },
              {
                type: 'section',
                text: { type: 'mrkdwn', text: `*🔴  Major Updates  (${updates.major.length})*` }
              },
              ...fmt(updates.major),
              { type: 'divider' },
              {
                type: 'section',
                text: { type: 'mrkdwn', text: `*🟡  Minor Updates  (${updates.minor.length})*` }
              },
              ...fmt(updates.minor),
              { type: 'divider' },
              {
                type: 'section',
                text: { type: 'mrkdwn', text: `*🟢  Patch Updates  (${updates.patch.length})*` }
              },
              ...fmt(updates.patch),
              { type: 'divider' },
              {
                type: 'section',
                text: {
                  type: 'mrkdwn',
                  text: `*Summary*\nMajor: ${updates.major.length}   Minor: ${updates.minor.length}   Patch: ${updates.patch.length}   Total: ${total}`
                }
              }
            ]
          };

          fs.writeFileSync('/tmp/slack-payload.json', JSON.stringify(payload));
          console.log('Slack payload written. Total updates:', total);
          EOF

      # ── 4. Send to Slack via Incoming Webhook ────────────────────────────────
      #    Just one curl call. The webhook URL is a GitHub secret.
      #    No bot, no server, no SDK — just plain HTTPS.
      - name: Send report to Slack
        run: |
          curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d @/tmp/slack-payload.json
